name: macOS build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Homebrew)
        run: brew install cmake boost bison sse2neon sdl2 sdl2_image flex

      - name: Configure
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DDISCORD_ENABLED=OFF

      - name: Build engine-sim-app
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          cmake --build build --target engine-sim-app -j3

      - name: Build and run unit tests
        # Known failures inherited from upstream engine-sim are excluded so the step guards
        # against new regressions instead of being permanently red:
        #   - FunctionTests.FunctionGaussianTest and SynthesizerTests.SynthesizerSystemTest*:
        #     pre-existing failures carried over from upstream engine-sim; the test
        #     expectations no longer match the Function / Synthesizer implementation.
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          cmake --build build --target engine-sim-test -j3
          ./build/engine-sim-test --gtest_brief=1 \
            '--gtest_filter=-FunctionTests.FunctionGaussianTest:SynthesizerTests.SynthesizerSystemTest*'

      - name: Package redline.app
        run: cmake --build build --target redline-app -j3

      - name: Upload app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redline-app
          path: dist/redline.app
          if-no-files-found: error
